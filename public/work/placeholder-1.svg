  <text x="800" y="448" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="500" fill="#6b6b80" letter-spacing="4">01</text>

  <text x="72" y="918" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#43434f" letter-spacing="3">COVER · 1600 × 1000</text>
