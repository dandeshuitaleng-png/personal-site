  <circle cx="800" cy="420" r="196" fill="none" stroke="url(#ring1)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="800" cy="420" r="150" fill="#1a1a24"/>
  <circle cx="800" cy="420" r="150" fill="none" stroke="#2e2e3d" stroke-width="1.5"/>
